<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Outer hexagon border -->
  <polygon points="50,5 90,25 90,75 50,95 10,75 10,25" fill="white" stroke="#0d0a24" stroke-width="3"/>

  <!-- Inner hexagon (navy) -->
  <polygon points="50,12 83,30 83,70 50,88 17,70 17,30" fill="#0d0a24"/>

  <!-- Dial circle outline -->
  <circle cx="50" cy="50" r="25" fill="none" stroke="white" stroke-width="2.5"/>

  <!-- Dial spokes -->
  <line x1="50" y1="27" x2="50" y2="35" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="65" x2="50" y2="73" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="27" y1="50" x2="35" y2="50" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="65" y1="50" x2="73" y2="50" stroke="white" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Diagonal spokes -->
  <line x1="33" y1="33" x2="39" y2="39" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="61" y1="61" x2="67" y2="67" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="67" y1="33" x2="61" y2="39" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="33" y1="67" x2="39" y2="61" stroke="white" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Center gear (green) -->
  <circle cx="50" cy="50" r="10" fill="#00d88d"/>
  <circle cx="50" cy="50" r="4" fill="#0d0a24"/>

  <!-- Gear teeth -->
  <rect x="47" y="38" width="6" height="5" fill="#00d88d"/>
  <rect x="47" y="57" width="6" height="5" fill="#00d88d"/>
  <rect x="38" y="47" width="5" height="6" fill="#00d88d"/>
  <rect x="57" y="47" width="5" height="6" fill="#00d88d"/>
</svg>
