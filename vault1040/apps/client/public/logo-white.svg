<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180">
  <!-- Hinge bars on left -->
  <rect x="15" y="55" width="20" height="8" rx="4" fill="white"/>
  <rect x="15" y="75" width="20" height="8" rx="4" fill="white"/>

  <!-- Outer hexagon border -->
  <polygon points="100,10 170,45 170,115 100,150 45,115 45,45" fill="none" stroke="white" stroke-width="4"/>

  <!-- Inner hexagon -->
  <polygon points="100,22 160,52 160,108 100,138 55,108 55,52" fill="rgba(255,255,255,0.1)"/>

  <!-- Dial circle outline -->
  <circle cx="107" cy="80" r="38" fill="none" stroke="white" stroke-width="3"/>

  <!-- Dial spokes -->
  <line x1="107" y1="45" x2="107" y2="55" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="107" y1="105" x2="107" y2="115" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="70" y1="80" x2="80" y2="80" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="134" y1="80" x2="144" y2="80" stroke="white" stroke-width="3" stroke-linecap="round"/>

  <!-- Diagonal spokes -->
  <line x1="80" y1="53" x2="87" y2="60" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="127" y1="100" x2="134" y2="107" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="134" y1="53" x2="127" y2="60" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="80" y1="107" x2="87" y2="100" stroke="white" stroke-width="3" stroke-linecap="round"/>

  <!-- Center gear (green) -->
  <circle cx="107" cy="80" r="12" fill="#00d88d"/>
  <circle cx="107" cy="80" r="5" fill="#0d0a24"/>

  <!-- Gear teeth -->
  <rect x="103" y="65" width="8" height="6" fill="#00d88d"/>
  <rect x="103" y="89" width="8" height="6" fill="#00d88d"/>
  <rect x="92" y="76" width="6" height="8" fill="#00d88d"/>
  <rect x="116" y="76" width="6" height="8" fill="#00d88d"/>
</svg>
